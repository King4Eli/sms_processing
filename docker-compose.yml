# Run with: docker compose --env-file ./.env/db.env up -d --build
# (--env-file is required because DB credentials live in ./.env/db.env,
# not the ./.env that Compose auto-loads — and ./.env here is a directory
# anyway, which Compose silently ignores for auto-loading.)
#
# Schema is applied automatically on api startup from _docs/schema.sql -
# no separate migrate step.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env/db.env
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
