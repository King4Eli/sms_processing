<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMS Processing</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1rem; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #ddd; }
    nav a { text-decoration: none; color: #555; }
    nav a.active { color: #111; font-weight: 600; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.25rem; font: inherit; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; font: inherit; cursor: pointer; }
    #result { margin-top: 1.5rem; padding: 0.75rem; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; }
    #result.ok { background: #e6f4ea; color: #1e4620; }
    #result.err { background: #fce8e6; color: #611a15; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="active">Send SMS</a>
    <a href="/users.html">Get API key</a>
    <a href="/worker.html">Get worker token</a>
  </nav>

  <h1>Send an SMS</h1>
  <form id="sms-form">
    <label for="api-key">API key</label>
    <input id="api-key" type="password" autocomplete="off" required />

    <label for="to">To</label>
    <input id="to" type="tel" placeholder="+15551234567" required />

    <label for="message">Message</label>
    <textarea id="message" rows="4" required></textarea>

    <button type="submit">Queue SMS</button>
  </form>
  <div id="result" hidden></div>

  <script>
    const form = document.getElementById("sms-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const apiKey = document.getElementById("api-key").value;
      const to = document.getElementById("to").value;
      const message = document.getElementById("message").value;

      result.hidden = true;
      try {
        const res = await fetch("/api/v1/sms", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Api-Key": apiKey,
          },
          body: JSON.stringify({ to, message }),
        });
        const body = await res.json();

        result.hidden = false;
        result.className = res.ok ? "ok" : "err";
        result.textContent = res.ok
          ? `Queued (id ${body.id}, status ${body.status})`
          : `Error ${res.status}: ${body.error || "unknown"}`;

        if (res.ok) {
          document.getElementById("message").value = "";
        }
      } catch (err) {
        result.hidden = false;
        result.className = "err";
        result.textContent = `Request failed: ${err.message}`;
      }
    });
  </script>
</body>
</html>
