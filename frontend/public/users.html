<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get API key - SMS Processing</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1rem; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #ddd; }
    nav a { text-decoration: none; color: #555; }
    nav a.active { color: #111; font-weight: 600; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.25rem; font: inherit; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; font: inherit; cursor: pointer; }
    #result { margin-top: 1.5rem; padding: 0.75rem; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; word-break: break-all; }
    #result.ok { background: #e6f4ea; color: #1e4620; }
    #result.err { background: #fce8e6; color: #611a15; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Send SMS</a>
    <a href="/users.html" class="active">Get API key</a>
    <a href="/worker.html">Get worker token</a>
  </nav>

  <h1>Get a customer API key</h1>
  <p>Used to submit SMS on the "Send SMS" page. Anyone with an email and phone number can generate one.</p>
  <form id="token-form">
    <label for="email">Email</label>
    <input id="email" type="email" required />

    <label for="phone">Phone number</label>
    <input id="phone" type="tel" placeholder="+15551234567" required />

    <label for="label">Label (optional)</label>
    <input id="label" type="text" placeholder="e.g. my app" />

    <button type="submit">Generate API key</button>
  </form>
  <div id="result" hidden></div>

  <script>
    const form = document.getElementById("token-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const label = document.getElementById("label").value;

      result.hidden = true;
      try {
        const res = await fetch("/api/v1/users/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, phone, label: label || undefined }),
        });
        const body = await res.json();

        result.hidden = false;
        result.className = res.ok ? "ok" : "err";
        result.textContent = res.ok
          ? `API key (store it now, shown once):\n${body.apiKey}`
          : `Error ${res.status}: ${body.error || "unknown"}`;
      } catch (err) {
        result.hidden = false;
        result.className = "err";
        result.textContent = `Request failed: ${err.message}`;
      }
    });
  </script>
</body>
</html>
